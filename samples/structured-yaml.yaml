# The structured YAML mapping form
#
# What it shows: instead of one packed string, spell the parts out as keys.
# `url`, `ref` and `path` map 1:1 onto the one-liner's host/repo, `#ref`, and
# `?path=`. `url` is the bare host/repo with no `git:` prefix. A trailing `.git`
# is accepted; DPM drops it.
#
# Reach for it when: the one-liner is getting long and you would rather read
# three labelled fields, or you are generating daml.yaml from a template.
#
# After `dpm-dev install package`, DPM should resolve `master` to a commit SHA
# and rewrite the mapping to a pinned one-liner of the form
# `git:github.com/Moonsong-Labs/test-daml-hello#<sha>?path=…`. It should print:
#
#   Resolving git dependency: fetching https://github.com/Moonsong-Labs/test-daml-hello @ "master" path "dist/test-daml-hello-sdk-3.5.2-lf-2.2.dar"

data-dependencies:
  - git:
      url: github.com/Moonsong-Labs/test-daml-hello.git
      ref: master
      path: dist/test-daml-hello-sdk-3.5.2-lf-2.2.dar
